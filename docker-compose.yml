# Dev:   docker compose --profile dev up --build
# Prod:  docker compose --profile prod up --build
services:
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true" # reliable file watching on bind mounts (Docker Desktop)
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - /app/node_modules # keep the image's installed modules

  prod:
    profiles: [prod]
    build:
      context: .
      target: prod
      # Vite inlines VITE_* at BUILD time, so set them here (build args), not at runtime.
      # They are public in the bundle. Values come from the shell or .env (compose interpolation).
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-Mortgage Calculator}
    image: mortgage-calculator:prod
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
    restart: unless-stopped
