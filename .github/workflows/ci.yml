name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  # Public placeholders; VITE_* values are inlined into the bundle (see CLAUDE.md).
  VITE_APP_NAME: Mortgage Calculator

jobs:
  verify:
    name: Check, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Audit dependencies (full tree)
        run: yarn npm audit --all --recursive

      - name: Lint and format (Biome)
        run: yarn check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  docker:
    name: Docker prod image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the prod target
        run: docker build --target prod -t mortgage-calculator:ci .
